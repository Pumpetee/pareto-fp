name: tests

# Зелёный прогон на чистой машине — главный сигнал, что проект не пет-поделка.
# Тесты не требуют компилятора, поэтому идут на всех трёх системах.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: smoke run of the CLI
        run: python -m pareto.cli "x*x - y*y" --domain x=1..2 --domain y=1..2

      # Каждый пример из examples/ обязан считаться на чистой машине. Пример,
      # который не запускается, — это не документация, а обещание, и он отваливает
      # первого же человека, который решил проверить нас своими руками.
      - name: every example in examples/ must run
        shell: bash
        run: |
          set -e
          python -m pareto.cli --file examples/rosa_turbine.c --list
          for fn in turbine1 turbine2 turbine3; do
            python -m pareto.cli --file examples/rosa_turbine.c --function $fn --time-budget 20
          done
          for fn in safe_diff_sqrt expm1_guard jumpy; do
            python -m pareto.cli --file examples/branch_sqrt.c --function $fn --time-budget 20
          done
          python -m pareto.cli --file examples/mixed_precision.c --function energy --time-budget 20
          python -m pareto.cli --file examples/newton_loop.c --function sqrt_newton --time-budget 20
      - name: mixed precision and the format tuner
        run: |
          python -m pareto.cli "0.5*m*v*v + m*9.81*h" --domain m=1..2 --domain v=0..30 --domain h=0..100 --target 1e-3

      # `--require` отвечает КОДОМ ВОЗВРАТА, а не текстом: на него смотрит чужой
      # скрипт сборки. Значит проверять надо именно код, и проверять на всех трёх
      # системах — оболочки по-разному обращаются с ним ровно так же охотно, как
      # с кодировками.
      - name: the requirement mode must answer with its exit code
        shell: bash
        run: |
          set -u
          fails=0
          check () {
            want=$1; shift
            python -m pareto.cli "$@" > /dev/null 2>&1 && got=0 || got=$?
            if [ "$got" != "$want" ]; then
              echo "expected exit $want, got $got: $*"; fails=$((fails+1))
            fi
          }
          D1="--domain x=1000..1000.001"
          D2="--domain y=999.999..1000"
          # Граница как написано 1.16e-10, у переписанной формы 3.33e-16.
          check 0 "x*x - y*y" $D1 $D2 --time-budget 20 --require 1e-9
          check 1 "x*x - y*y" $D1 $D2 --time-budget 20 --require 1e-12
          check 2 "x*x - y*y" $D1 $D2 --time-budget 20 --require 1e-30
          # Опечатка в аргументах не имеет права выглядеть как вердикт проверки.
          check 64 "x*x - y*y" --domain nonsense
          check 64 "x*x - y*y" $D1 $D2 --diff
          [ "$fails" = 0 ]
      - name: the ready-to-run single file must build and work
        run: |
          python tools/build_release.py
          python dist/pareto-fp.pyz --file examples/rosa_turbine.c --function turbine1 --time-budget 20

  benchmark:
    # Timings need clang, so this is a separate job. Two architectures on purpose:
    # ubuntu is x86-64, macos-latest is arm64. A speed ratio that only exists on
    # one machine is not a result, and the obvious objection to numbers from a
    # single thermally limited laptop is a fair one.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: machine and clang version
        run: |
          uname -m
          clang --version
      # Файл, который инструмент отдал человеку, обязан СОБИРАТЬСЯ. Это не
      # придирка: первая же версия обратной записи выдала файл без `#include
      # <math.h>`, и он не компилировался — выглядело это как поломка инструмента,
      # а не как забытый заголовок. Компилятор здесь уже есть, поэтому проверка
      # стоит ровно там, где ничего не стоит.
      - name: every rewritten example must compile
        shell: bash
        run: |
          set -eu
          mkdir -p rewritten
          while read -r file fn; do
            out="rewritten/$(basename "${file%.c}")_$fn.c"
            python -m pareto.cli --file "$file" --function "$fn" -o "$out" --time-budget 30
            clang -c -O2 -std=c11 -Wall -Werror=implicit-function-declaration \
                  -o /dev/null "$out"
            echo "compiled $out"
          done <<'CASES'
          examples/branch_sqrt.c safe_diff_sqrt
          examples/branch_sqrt.c expm1_guard
          examples/branch_sqrt.c jumpy
          examples/mixed_precision.c energy
          examples/newton_loop.c sqrt_newton
          examples/rosa_turbine.c turbine1
          examples/rosa_turbine.c turbine2
          examples/rosa_turbine.c turbine3
          CASES

      - name: fair benchmark against -O3 and -ffast-math
        run: python pareto/run_fairbench.py
      - name: how loose the proven bound is
        run: python pareto/run_tightness.py
      # Таблица по FPBench раньше считалась только у автора на ноутбуке, а в README
      # стояла как факт. Теперь её пересчитывает чистая машина, и часы на задачу
      # стоят затем, чтобы прогон был предсказуем по времени: срезанная стадия
      # делает границу шире, но не делает её неверной.
      - name: proven bounds on the FPBench rosa cases
        env:
          # Часы стоят на задачу и специально ЗАВЕДОМО БОЛЬШЕ, чем нужно любой из
          # них: иначе на медленном раннере уточнение у carbonGas срезалось бы, и
          # артефакт CI печатал бы числа слабее тех, что стоят в README, — таблица
          # перестала бы сходиться сама с собой. Здесь часы только страховка от
          # зависшего прогона, а не режим экономии.
          PARETO_TIME_BUDGET: '900'
        run: python pareto/run_fpbench.py
      - name: head-to-head on Herbie's own metric
        run: python pareto/run_herbie_metric.py
      - name: publish raw numbers
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}
          path: |
            bench/fair_report.txt
            bench/fair_results.json
            bench/tightness_report.txt
            bench/herbie_metric_report.txt
            bench/fpbench_report.txt
            bench/fpbench_results.json

  rivals:
    # The comparison against FPTaylor and Daisy, re-run on a clean machine. Both tools are
    # third-party and heavy to install, so this is manual: the point is that anyone can press
    # the button and get our table, not that it blocks every push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # 26.09.2026: этот шаг упал, и Daisy за ним просто не запустилась — колонка
      # осталась пустой из-за чужого инструмента. Теперь провал FPTaylor не мешает
      # Daisy: run_rivals.py сам проставит n/a тому, кого не нашёл.
      - name: FPTaylor (js_of_ocaml build published by its authors)
        continue-on-error: true
        run: |
          git clone --depth 1 -b gh-pages https://github.com/monadius/FPTaylorJS fptaylor-gh-pages
          git clone --depth 1 https://github.com/monadius/FPTaylorJS fptaylor-src
          cp fptaylor-gh-pages/fptaylor.js tools/fptaylor_js/fptaylor.js
          node tools/fptaylor_js/extract_config.js fptaylor-src/src/default_config.js

      - name: FPTaylor answers a known question
        continue-on-error: true
        run: |
          printf 'Variables\n  real x in [1, 20];\n\nExpressions\n  r rnd64= x + x;\n' > /tmp/t.txt
          # Вывод печатаем: grep -q его проглатывал, и было непонятно, что сломалось у них.
          node tools/fptaylor_js/run.js /tmp/t.txt | tee /tmp/fpt_out.txt
          grep -q '7.10542735761e-15' /tmp/fpt_out.txt

      # 26.09.2026: прогон упал на `sbt: command not found` — sbt убрали из образа
      # ubuntu-latest. Ставим лаунчер сами с релизов проекта: это не зависит ни от
      # состава образа, ни от чужого apt-репозитория.
      - name: sbt
        if: always()
        run: |
          curl -fsSL https://github.com/sbt/sbt/releases/download/v1.11.3/sbt-1.11.3.tgz -o /tmp/sbt.tgz
          sudo tar xzf /tmp/sbt.tgz -C /opt
          echo "/opt/sbt/bin" >> $GITHUB_PATH
          /opt/sbt/bin/sbt --version

      - name: Daisy
        if: always()
        run: |
          sudo apt-get update && sudo apt-get install -y libmpfr-dev
          git clone --depth 1 https://github.com/malyzajko/daisy ../daisy
          cd ../daisy
          echo 'sbt.version=1.11.3' > project/build.properties
          sbt compile script

      - name: Daisy reproduces the number from its own README
        if: always()
        run: |
          cd ../daisy
          ./daisy --silent testcases/rosa/Doppler.scala | grep -q '4.1911988101104756e-13'

      - name: head-to-head on FPBench
        if: always()
        timeout-minutes: 90
        env:
          FPTAYLOR_JS: tools/fptaylor_js
          DAISY_HOME: ${{ github.workspace }}/../daisy
          DAISY_TIMEOUT: '180'
          PARETO_SPLIT_BOXES: '64'
        run: python pareto/run_rivals.py

      - name: publish raw numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rivals-results
          path: |
            bench/rivals_report.txt
            bench/rivals_results.json

name: tests

# Зелёный прогон на чистой машине — главный сигнал, что проект не пет-поделка.
# Тесты не требуют компилятора, поэтому идут на всех трёх системах.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: smoke run of the CLI
        run: python -m pareto.cli "x*x - y*y" --domain x=1..2 --domain y=1..2

  benchmark:
    # Timings need clang, so this is a separate job. Two architectures on purpose:
    # ubuntu is x86-64, macos-latest is arm64. A speed ratio that only exists on
    # one machine is not a result, and the obvious objection to numbers from a
    # single thermally limited laptop is a fair one.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: machine and clang version
        run: |
          uname -m
          clang --version
      - name: fair benchmark against -O3 and -ffast-math
        run: python pareto/run_fairbench.py
      - name: how loose the proven bound is
        run: python pareto/run_tightness.py
      - name: head-to-head on Herbie's own metric
        run: python pareto/run_herbie_metric.py
      - name: publish raw numbers
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}
          path: |
            bench/fair_report.txt
            bench/fair_results.json
            bench/tightness_report.txt
            bench/herbie_metric_report.txt

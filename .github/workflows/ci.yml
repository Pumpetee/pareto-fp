name: tests

# Зелёный прогон на чистой машине — главный сигнал, что проект не пет-поделка.
# Тесты не требуют компилятора, поэтому идут на всех трёх системах.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: smoke run of the CLI
        run: python -m pareto.cli "x*x - y*y" --domain x=1..2 --domain y=1..2

  benchmark:
    # Замеры требуют clang, поэтому отдельной работой и только на Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: clang version
        run: clang --version
      - name: fair benchmark against -O3 and -ffast-math
        run: python pareto/run_fairbench.py
      - name: publish raw numbers
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench/fair_report.txt
            bench/fair_results.json

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pareto-fp"
version = "0.3.0"
description = "Rewrites a floating-point expression, or a whole C function, into an equivalent one with a proven upper bound on the error"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 WITH LLVM-exception"
license-files = ["LICENSE"]
authors = [{ name = "Anton Sannikov" }]
keywords = ["floating-point", "error-bound", "e-graph", "compiler", "numerics",
            "mixed-precision", "mlir"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Compilers",
]
# Зависимостей нет и это принципиально: единственный способ, которым чужой человек
# действительно запустит утилиту, — запуск без установки чего-либо ещё.
dependencies = []

[project.urls]
Homepage = "https://github.com/Pumpetee/pareto-fp"
Source = "https://github.com/Pumpetee/pareto-fp"

[project.scripts]
pareto-fp = "pareto.cli:main"

[tool.setuptools]
packages = ["pareto"]
